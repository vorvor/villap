villa_promenade_contact.form:
  path: '/contact/event'
  defaults:
    _form: '\Drupal\villa_promenade_contact\Form\EventContactForm'
    _title: 'Event enquiry'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE

villa_promenade_contact.thank_you:
  path: '/contact/event/thank-you'
  defaults:
    _controller: '\Drupal\villa_promenade_contact\Controller\ThankYouController::build'
    _title: 'Köszönjük a megkeresést, hamarosan jelentkezünk!'
  requirements:
    _access: 'TRUE'

villa_promenade_contact.approve_request:
  path: '/admin/content/customer-requests/{node}/approve'
  defaults:
    _form: '\Drupal\villa_promenade_contact\Form\RequestApprovalForm'
    _title: 'Approve customer request'
  requirements:
    _permission: 'manage villa customer requests'
    _entity_access: 'node.update'
    node: '\d+'
  options:
    _admin_route: TRUE
    parameters:
      node:
        type: entity:node

villa_promenade_contact.settings:
  path: '/admin/config/system/villa-promenade-contact'
  defaults:
    _form: '\Drupal\villa_promenade_contact\Form\ContactSettingsForm'
    _title: 'Villa Promenade contact notifications'
  requirements:
    _permission: 'administer villa contact settings'
  options:
    _admin_route: TRUE
