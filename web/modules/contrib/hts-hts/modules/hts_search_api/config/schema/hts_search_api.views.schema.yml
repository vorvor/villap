# Schema for the HTS Search API Views filter.

views.filter.hts_search_api_term:
  type: views.filter.search_api_term
  label: 'HTS Search API taxonomy term'
  mapping:
    hierarchical_term_selector:
      type: mapping
      label: 'Hierarchical term selector settings'
      mapping:
        hierarchy_depth:
          type: integer
          label: 'Hierarchy depth'
        label_level:
          type: text
          label: 'Label per level'
        description_level:
          type: text
          label: 'Description per level'
        none_label:
          type: text
          label: 'The "no selection" label'
        widget_type:
          type: string
          label: 'Widget type'
          constraints:
            Choice:
              choices:
                - select
                - select2
        label_hide:
          type: boolean
          label: 'Hide field label'
        multiple_parent_policy:
          type: string
          label: 'Multiple-parent policy'
          constraints:
            Choice:
              choices:
                - first
                - all

views.filter_value.hts_search_api_term:
  type: views.filter_value.search_api_term
  label: 'HTS Search API taxonomy term filter value'
